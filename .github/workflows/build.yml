name: build

on:
  push:
    branches: [main]
  pull_request:

# The pull-request job commits the rebuilt published tree back to the branch,
# so contributors do not need the Go toolchain to change a skill.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # On a pull request, check out the head branch itself rather than the
      # merge commit, so a rebuild has somewhere to be committed.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install litprompt
        run: go install github.com/tgvashworth/litprompt@latest

      # Imports resolve, no cycles, and every skill declares a semver version.
      - name: Check sources
        run: make check

      # A published file left behind after its source was deleted.
      - name: Check for orphans
        run: make orphans

      - name: Build
        run: make build

      # The published tree is machine-owned, so CI owns generating it: on a
      # same-repo PR any drift is committed back. Anywhere the token cannot
      # push — a push to main, a fork PR — fall back to failing, because there
      # is nowhere to put the fix.
      - name: Publish or verify
        env:
          CAN_PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "ok: published tree is in sync with its sources"
            exit 0
          fi
          echo "published tree differs from a fresh build:"
          git status --short
          if [ "$CAN_PUSH" != "true" ]; then
            echo "ERROR: this event cannot commit the rebuild."
            echo "Run 'make build' locally and commit the result."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] so this commit does not queue a second run. A run
          # triggered by the bot's own push needs manual approval, which would
          # leave the PR sitting on an unapproved check forever.
          git commit -m "Rebuild published skills [skip ci]" -m "Generated by 'make build' in CI."
          git push
          echo "ok: committed the rebuild to $HEAD_REF"

      # Belt and braces: nothing in a -src tree may be named SKILL.md, or it
      # would be discovered as a skill and ship author-only notes to installs.
      - name: Assert no sources are discoverable as skills
        run: |
          if find . -path ./.git -prune -o -path '*-src/*' -name 'SKILL.md' -print | grep .; then
            echo "ERROR: a source tree contains a literal SKILL.md (see above)."
            echo "Sources must use the .src.md suffix so 'npx skills add' ignores them."
            exit 1
          fi
          echo "ok: no SKILL.md inside any -src tree"
